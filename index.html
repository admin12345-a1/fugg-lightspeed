<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUGG // GAME FORGE</title>
<style>
:root{--bg:#11100e;--paper:#f2eadb;--muted:#a59b8c;--line:#443d34;--hot:#ff6847;--cool:#8bd6cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:15px Georgia,serif}main{width:min(1100px,calc(100% - 32px));margin:auto;padding:28px 0 44px}header{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px;gap:25px}h1{margin:0;font:clamp(32px,7vw,72px)/.84 Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;letter-spacing:.02em}h1 span{color:var(--hot)}.kicker,.meta,.hud{font:11px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.lede{max-width:350px;color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:18px}.stage{border:1px solid var(--line);background:#191714;padding:14px}.stagebar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:2px 2px 12px}.stagebar strong{font-size:20px;font-weight:normal}.stagebar span{color:var(--hot)}canvas{display:block;width:100%;height:auto;background:#222}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px 0}.hint{color:var(--muted);font-size:13px}.btn{border:1px solid var(--hot);background:var(--hot);color:#1a0d09;padding:10px 14px;cursor:pointer;font:12px ui-monospace,monospace;text-transform:uppercase}.btn:hover{filter:brightness(1.15)}.panel{border:1px solid var(--line);padding:18px;background:#171512}.panel h2{font-size:20px;font-weight:normal;margin:0 0 18px}.stat{border-top:1px solid var(--line);padding:12px 0}.stat:first-of-type{border-top:0}.stat b{display:block;font:11px ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.stat strong{font-size:24px;font-weight:normal}.bar{height:5px;background:#342e28;margin-top:7px}.bar i{display:block;height:100%;background:var(--cool);transition:width .2s}.brief{color:#cfc4b1;line-height:1.55}.brief em{color:var(--hot);font-style:normal}.log{color:var(--muted);font-size:13px;line-height:1.45}.log p{border-left:2px solid var(--line);padding-left:10px;margin:9px 0}.modal{position:fixed;inset:0;background:#090807dd;display:grid;place-items:center;padding:20px}.modal[hidden]{display:none}.modalbox{width:min(520px,100%);background:#211c17;border:1px solid var(--hot);padding:28px}.modalbox h2{font-size:36px;margin:8px 0}.modalbox p{color:#cec1ac}.seed{color:var(--cool)}@media(max-width:720px){main{width:calc(100% - 20px);padding-top:16px}header{display:block}.lede{margin-top:14px}.grid{grid-template-columns:1fr}.stage{padding:9px}.controls{align-items:flex-start;flex-direction:column}.btn{width:100%}}
</style></head>
<body><main>
<header><div><div class="kicker">FUGG / autonomous game director</div><h1>GAME<span>FORGE</span></h1></div><p class="lede">An engine that invents a new little world every time you press the button. Different rules. Different stakes. Real playable graphics.</p></header>
<div class="grid"><section class="stage"><div class="stagebar"><strong id="title">Generating...</strong><span id="genre" class="meta"></span></div><canvas id="screen" width="760" height="480" aria-label="Generated game screen"></canvas><div class="controls"><span id="hint" class="hint">Loading a world...</span><button id="new" class="btn">Generate another game</button></div></section><aside class="panel"><h2>Director's card</h2><div class="stat"><b>Game DNA</b><strong id="dna" class="seed">----</strong></div><div class="stat"><b>Objective</b><p id="brief" class="brief"></p></div><div class="stat"><b>World state</b><div id="state"></div></div><div class="stat"><b>Event feed</b><div id="log" class="log"></div></div></aside></div>
</main><div id="modal" class="modal" hidden><div class="modalbox"><div class="kicker">RUN COMPLETE</div><h2 id="result"></h2><p id="resultcopy"></p><button class="btn" id="again">Make a new game</button></div></div>
<script>
const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let game,keys={};
const names=['Ember','Morrow','Nacre','Vanta','Hush','Kestrel','Cinder','Orison','Talon','Mica','Sable','Fallow'];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}function pick(a,r){return a[Math.floor(r()*a.length)]}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function make(){let seed=Math.floor(Math.random()*2147483647),r=rng(seed),kind=Math.floor(r()*5);let palette=pick([{bg:'#101b21',ink:'#c8e1dc',accent:'#ef775b',name:'salt and signal'},{bg:'#1c121d',ink:'#f1d5b5',accent:'#dba84b',name:'violet dusk'},{bg:'#111a13',ink:'#d6e8bc',accent:'#d0ec67',name:'green machine'},{bg:'#20140f',ink:'#f4d6b2',accent:'#ff795c',name:'burnt copper'},{bg:'#101016',ink:'#d8d7ee',accent:'#9ca9ff',name:'blue midnight'}],r);game={seed,r,kind,palette,turn:0,won:false,over:false,log:[],objects:[],player:{x:380,y:240},target:null};document.documentElement.style.setProperty('--hot',palette.accent);document.documentElement.style.setProperty('--cool',palette.ink);$('dna').textContent=seed.toString(36).toUpperCase();$('title').textContent=pick(['The Last '+pick(names,r),'Operation '+pick(names,r),'No Map for '+pick(names,r),'A Small Problem on '+pick(names,r)],r);$('genre').textContent=pick(['SALVAGE / TACTICAL','COURIER / STEALTH','ORCHARD / SURVIVAL','ORBITAL / DEFENSE','RUIN / EXPLORATION'],r);createWorld();render();loop()}
function createWorld(){let g=game,r=g.r;g.log.push('The director has finished drawing the rules.');if(g.kind===0){g.player={x:380,y:400};g.target={x:380,y:75};g.objects=Array.from({length:12},()=>({x:40+r()*680,y:80+r()*320,rad:9+14*r(),taken:false}));$('brief').innerHTML='Recover <em>six signal cores</em> and carry them to the extraction beacon. Arrow keys move. The red fragments are unstable.';$('hint').textContent='ARROW KEYS: MOVE / SPACE: PULSE SCANNER'}else if(g.kind===1){g.player={x:55,y:240};g.target={x:705,y:240};g.objects=Array.from({length:7},()=>({x:150+r()*500,y:70+r()*340,rad:12,dx:(r()-.5)*1.4,dy:(r()-.5)*1.4}));$('brief').innerHTML='Cross the yard with the <em>sealed letter</em>. The blue searchlights remember where they saw you.';$('hint').textContent='ARROW KEYS: SNEAK / HIDE BEHIND THE DARK'}else if(g.kind===2){g.player={x:380,y:400};g.target=null;g.objects=Array.from({length:18},()=>({x:30+r()*700,y:30+r()*400,rad:5+10*r(),grown:0}));$('brief').innerHTML='Keep <em>eight seedlings</em> alive through the dry season. Move water from the well to the pale sprouts.';$('hint').textContent='ARROW KEYS: MOVE / SPACE: WATER NEARBY SPROUT'}else if(g.kind===3){g.player={x:380,y:240};g.target=null;g.objects=Array.from({length:5},()=>({x:70+r()*620,y:60+r()*340,rad:22,angle:r()*6,alive:true}));$('brief').innerHTML='Protect the beacon for <em>45 seconds</em>. Aim with the mouse and click to fire at incoming fragments.';$('hint').textContent='MOUSE: AIM + FIRE / ARROW KEYS: ROTATE'}else{g.player={x:380,y:400};g.target={x:380,y:60};g.objects=Array.from({length:10},()=>({x:40+r()*680,y:80+r()*290,rad:10+8*r(),found:false}));$('brief').innerHTML='Read the ruins in the right order: find <em>five glyphs</em> without stepping on a false memory.';$('hint').textContent='ARROW KEYS: EXPLORE / SPACE: INTERACT'} }
function render(){let g=game;let status=g.kind===1?Math.max(0,100-g.turn*2):g.kind===3?Math.max(0,100-g.turn*1.4):g.kind===2?Math.max(0,100-g.turn*.8):100;$('state').innerHTML=`<div class="meta">${g.won?'OBJECTIVE COMPLETE':g.over?'WORLD LOST':'TURN '+g.turn+' / '+(g.kind===3?'45':'∞')}</div><div class="bar"><i style="width:${status}%"></i></div>`;$('log').innerHTML=g.log.slice(-4).reverse().map(x=>`<p>${x}</p>`).join('')}
function draw(){let g=game,p=g.player,w=canvas.width,h=canvas.height;ctx.fillStyle=g.palette.bg;ctx.fillRect(0,0,w,h);ctx.strokeStyle=g.palette.ink+'18';for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}if(g.kind===0){g.objects.forEach(o=>{if(!o.taken){ctx.fillStyle=g.palette.accent;ctx.beginPath();ctx.arc(o.x,o.y,o.rad,0,7);ctx.fill();ctx.fillStyle='#fff8';ctx.fillRect(o.x-2,o.y-o.rad-7,4,4)}});ctx.strokeStyle=g.palette.ink;ctx.strokeRect(g.target.x-25,g.target.y-25,50,50)}if(g.kind===1){ctx.fillStyle=g.palette.ink+'25';g.objects.forEach(o=>{ctx.beginPath();ctx.arc(o.x,o.y,o.rad,0,7);ctx.fill();ctx.fillStyle=g.palette.accent+'25';ctx.fillRect(o.x-30,o.y-3,60,6);ctx.fillStyle=g.palette.ink+'25'});ctx.fillStyle=g.palette.accent;ctx.fillRect(g.target.x-7,g.target.y-45,14,90)}if(g.kind===2){g.objects.forEach(o=>{ctx.fillStyle=o.grown?'#6a9a4a':g.palette.ink;ctx.beginPath();ctx.arc(o.x,o.y,o.rad,0,7);ctx.fill();if(o.grown){ctx.fillStyle=g.palette.accent;ctx.fillRect(o.x-2,o.y-o.rad-9,4,9)}})}if(g.kind===3){g.objects.forEach(o=>{if(o.alive){ctx.strokeStyle=g.palette.accent;ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.x,o.y,o.rad,0,7);ctx.stroke();o.x+=(p.x-o.x)/dist(o,p)*.35;o.y+=(p.y-o.y)/dist(o,p)*.35}});ctx.lineWidth=1}if(g.kind===4){g.objects.forEach(o=>{ctx.fillStyle=o.found?'#6a9a4a':g.palette.ink;ctx.fillRect(o.x-12,o.y-12,24,24);if(!o.found){ctx.strokeStyle=g.palette.accent;ctx.strokeRect(o.x-17,o.y-17,34,34)}});ctx.strokeStyle=g.palette.accent;ctx.strokeRect(g.target.x-22,g.target.y-22,44,44)}ctx.fillStyle=g.palette.accent;ctx.beginPath();ctx.arc(p.x,p.y,12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-3,p.y-3,3,0,7);ctx.fill()}
function update(){let g=game,p=g.player;if(g.over)return;let dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),speed=g.kind===1?2:3;p.x=Math.max(18,Math.min(742,p.x+dx*speed));p.y=Math.max(18,Math.min(462,p.y+dy*speed));if(g.kind===0){g.objects.forEach(o=>{if(!o.taken&&dist(p,o)<o.rad+14){o.taken=true;g.log.push('Signal core recovered. It is still humming.')}});if(g.objects.filter(o=>o.taken).length>=6&&dist(p,g.target)<38)finish(true,'A clean extraction.','Six cores, one ship, and no questions asked.')}if(g.kind===1){g.objects.forEach(o=>{o.x+=o.dx;o.y+=o.dy;if(o.x<30||o.x>730)o.dx*=-1;if(o.y<30||o.y>450)o.dy*=-1;if(dist(p,o)<o.rad+13)finish(false,'The letter was intercepted.','The yard was built to remember footsteps.');});if(dist(p,g.target)<30)finish(true,'Delivered without a trace.','The seal breaks in a quiet room three systems away.')}if(g.kind===2&&keys[' ']){g.objects.forEach(o=>{if(!o.grown&&dist(p,o)<45){o.grown=true;g.log.push('A seedling drinks. The color comes back.')}});if(g.objects.filter(o=>o.grown).length>=8)finish(true,'The orchard survives.','The dry season ends with green things pushing through the dust.')}if(g.kind===3){g.turn+=.04;g.objects.forEach(o=>{if(dist(p,o)<22)finish(false,'The beacon fell.','There were too many fragments and not enough sky.');});if(g.turn>=45)finish(true,'Beacon held.','The route is open. Ships will find their way home tonight.')}if(g.kind===4&&keys[' ']){g.objects.forEach(o=>{if(!o.found&&dist(p,o)<38){o.found=true;g.log.push('A glyph aligns. The ruin shifts around you.')}});if(g.objects.filter(o=>o.found).length>=5)finish(true,'The ruin opens.','You read the old sentence correctly, and the door agrees.')}if(g.kind!==3)g.turn+=.02;render()}
function finish(win,title,copy){game.over=true;game.won=win;game.log.push(win?'The director marks this world complete.':'The director has learned one more way to end a story.');$('result').textContent=title;$('resultcopy').textContent=copy;setTimeout(()=>$('modal').hidden=false,350)}function loop(){update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);canvas.addEventListener('click',e=>{if(game.kind===3){let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;game.objects.forEach(o=>{if(o.alive&&Math.hypot(o.x-x,o.y-y)<o.rad+16){o.alive=false;game.log.push('Fragment neutralized. The beacon holds.')}})}});$('new').onclick=make;$('again').onclick=()=>{$('modal').hidden=true;make()};make();
</script></body></html>
